<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Dashboard Portal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    
    <!-- SIDEBAR NAVIGATION -->
    <!-- THIS IS A GIT TEST -->
    <aside class="sidebar">
      <div class="logo">
        <h2>Client<span>Pulse</span></h2>
      </div>
      <nav class="nav-menu">
        <button class="nav-btn active" id="nav-table-view">
          <span class="icon">📊</span> Spreadsheet View
        </button>
        <button class="nav-btn" id="nav-grid-view">
          <span class="icon">🎴</span> Client Cards Grid
        </button>
      </nav>
      <button class="btn btn-primary btn-block" id="btn-open-modal">+ New Client</button>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
      
      <!-- TOP HEADER -->
      <header class="top-header">
        <h1 id="view-title">Spreadsheet Directory</h1>
        <div class="stats-summary">
          <div class="stat-pill">Total: <span id="stat-total">0</span></div>
          <div class="stat-pill">Active: <span id="stat-active">0</span></div>
        </div>
      </header>

      <!-- VIEW 1: SPREADSHEET TABLE -->
      <section id="section-table-view" class="view-section active">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Client Name</th>
                <th>Invoice</th>
                <th>Phone Number</th>
                <th>Email Address</th>
                <th>Address</th>
                <th>Comments</th>
                <th>Contact Date</th>
                <th>Project Status</th>
                <th>Payment Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <!-- Dynamically populated via JavaScript -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- VIEW 2: GRID CARDS VIEW -->
      <section id="section-grid-view" class="view-section">
        <div class="grid-container" id="grid-cards-container">
          <!-- Dynamically populated via JavaScript -->
        </div>
      </section>

      <!-- VIEW 3: SINGLE CLIENT DETAIL & TASK MANAGER VIEW -->
      <section id="section-detail-view" class="view-section">
        <button class="btn btn-secondary mb-20" id="btn-back-to-table">← Back to Table View</button>
        <div id="detail-content">
          <!-- Dynamically populated when a client is clicked -->
        </div>
      </section>

    </main>
  </div>

  <!-- REGISTRATION MODAL -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Register New Client</h3>
        <button class="btn-close" id="btn-close-modal">&times;</button>
      </div>
      <form id="client-form" class="modal-body">
        <div class="form-group">
          <label for="clientName">Client Name *</label>
          <input type="text" id="clientName" required placeholder="Acme Corp / John Doe">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="invoice">Invoice # *</label>
            <input type="text" id="invoice" required placeholder="INV-1001">
          </div>
          <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" placeholder="+1 (555) 000-0000">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" required placeholder="contact@client.com">
          </div>
          <div class="form-group">
            <label for="contactDate">Contact Date</label>
            <input type="date" id="contactDate" required>
          </div>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" placeholder="123 Main St, Suite 100">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="projectStatus">Project Status</label>
            <select id="projectStatus">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
              <option value="On Hold">On Hold</option>
            </select>
          </div>
          <div class="form-group">
            <label for="paymentStatus">Payment Status</label>
            <select id="paymentStatus">
              <option value="Pending">Pending</option>
              <option value="Paid">Paid</option>
              <option value="Overdue">Overdue</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="comments">Comments</label>
          <textarea id="comments" rows="3" placeholder="Notes about client requirements..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Client</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
